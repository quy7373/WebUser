global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    retries 3

# Sử dụng DNS nội bộ của Docker (127.0.0.11) để tự động cập nhật IP khi container khởi động lại
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      2s

# Cổng ảo Database (Virtual IP / Port 5432) cho toàn bộ 3 Backend Server kết nối vào
frontend postgres_frontend
    bind *:5432
    default_backend postgres_backend

# Tự động chuyển hướng kết nối từ DB1 sang DB2 nếu DB1 gặp sự cố
backend postgres_backend
    mode tcp
    option tcp-check

    # DB1 là Primary chính
    # fall 3 inter 2s = Chờ 6s trước khi chuyển sang Backup (để Watchdog kịp promote DB2 thành Master)
    server db_primary db_primary:5432 check inter 2s fall 3 rise 2 resolvers docker_dns resolve-prefer ipv4 on-marked-down shutdown-sessions

    # DB2 là Standby Backup (sẽ được kích hoạt khi DB1 sập và đã được Watchdog Promote thành Master)
    # on-marked-up shutdown-backup-sessions: Ngay khi DB1 sống lại, đóng toàn bộ kết nối tới DB2 để trở về DB1
    server db_replica db_replica:5432 check backup inter 2s fall 3 rise 2 resolvers docker_dns resolve-prefer ipv4 on-marked-up shutdown-backup-sessions on-marked-down shutdown-sessions
