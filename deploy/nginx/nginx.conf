events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # DNS nội bộ Docker để tự động cập nhật IP khi container khởi động lại
    resolver 127.0.0.11 valid=5s ipv6=off;

    # =========================================================================
    # CƠ CHẾ FAILOVER NỐI TẦNG (Server 1 -> Server 2 -> Server 3):
    # - Bình thường: 100% request xử lý bởi Server 1.
    # - Server 1 sập: Tự động chuyển ngay lập tức sang Server 2.
    # - Server 2 sập tiếp: Tự động chuyển ngay sang Server 3.
    # - Khi Server 1 phục hồi: Nginx tự động đưa Server 1 trở lại xử lý chính.
    # =========================================================================
    upstream backend_cluster {
        server app_server_1:5001 max_fails=2 fail_timeout=5s;
        server app_server_2:5001 max_fails=2 fail_timeout=5s backup;
        server app_server_3:5001 max_fails=2 fail_timeout=5s backup;
    }

    server {
        listen 80;
        server_name localhost;

        # Header theo dõi trực quan server nào đang xử lý request
        add_header X-Handled-By $upstream_addr always;

        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tự động chuyển sang server dự phòng nếu server hiện tại sập hoặc lỗi
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;

            # Tăng thời gian chờ tránh 504 khi backend gửi email SMTP ra ngoài
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
